- id: ZEKAM-DOD-001
  category: A. Kurulum ve çekirdek
  criterion: Temiz Linux, macOS ve Windows/WSL kurulum akışı dokümante ve test edilmiştir.
  state: pending
  architecture_classification: pending
  reclassification_evidence: AKTIF_GOREV.md#314-global-dod-guncellemesi
