  waiver_allowed: false
  evidence:
  - docs/YENI_MAKINEDE_BASLAMA.md
  - .zekam/evidence/ZEKAM-DOD-001-macos-20260821T070131Z.json
  - .zekam/evidence/ZEKAM-DOD-001-linux-20260821T072025Z.json
  - .zekam/defects/ZEKAM-DEF-003.json
  - .zekam/defects/ZEKAM-DEF-004.json
  assessment_note: 'Uc platformda temiz kurulum tatbikati kosuldu ve alti kapi da her
    birinde gecti. Windows: 2026-08-20, MINGW64_NT-10.0-26200. macOS: 2026-08-21, Darwin
    25.6.0 arm64, Python 3.12.14. Linux: 2026-08-21, python:3.12-slim (Debian 13 trixie,
    arm64) konteynerinde ayri veritabanina karsi sifirdan migration. Tatbikat iki gercek
    kusur buldu: symlink kararinin resolve sonrasinda verilmesi (commit e7b5c28) ve
    operator ZEKAM_DATABASE_* ortaminin testlere sizmasi (commit 8f266af). Ucuncu
    bir bosluk da kapatildi: zorunlu bakim islerini tanimlayan komut yoktu, bu
    yuzden taze kurulum doctor healthy donemiyordu; zekam scheduler init eklendi
    (commit db4e694, ZEKAM-DEF-004) ve sifirdan Linux kurulumunda doctor healthy
    dondu. Sinirlar: WSL ayri olarak kosulmadi, Windows ayagi native MSYS2
    uzerindedir; Linux ayagi macOS ustundeki konteynerdedir, ayri fiziksel makine
    degildir.'
