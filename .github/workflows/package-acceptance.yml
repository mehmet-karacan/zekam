name: package-acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build hatchling
      - run: python -m pip install -e .
      - run: python scripts/generate_package_manifest.py --check
      - run: python scripts/paket_dogrula.py
      - run: python -m build --sdist --wheel --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: zekam-distribution
          path: dist/
          if-no-files-found: error

  wheel-smoke:
    needs: build-artifacts
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: zekam-distribution
          path: dist
      - run: python -m pip install -e .
      - shell: python
        run: |
          import pathlib, subprocess, sys
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          subprocess.run([
              sys.executable, "scripts/package_smoke.py", "--wheel", str(wheel),
              "--allow-index", "--source-revision", "${{ github.sha }}",
              "--builder-identity", "github/build-artifacts",
              "--verifier-identity", "github/wheel-smoke-${{ matrix.os }}",
              "--verifier-provenance-digest", "sha256:${{ hashFiles('.github/workflows/package-acceptance.yml') }}",
              "--output", "package-acceptance.json",
          ], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: package-acceptance-${{ matrix.os }}
          path: package-acceptance.json

  sdist-smoke:
    needs: build-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: zekam-distribution
          path: dist
      - run: python -m pip install -e .
      - shell: python
        run: |
          import pathlib, subprocess, sys
          sdist = next(pathlib.Path("dist").glob("*.tar.gz"))
          subprocess.run([
              sys.executable, "scripts/package_smoke.py", "--sdist", str(sdist),
              "--allow-index", "--source-revision", "${{ github.sha }}",
              "--builder-identity", "github/build-artifacts",
              "--verifier-identity", "github/sdist-smoke",
              "--verifier-provenance-digest", "sha256:${{ hashFiles('.github/workflows/package-acceptance.yml') }}",
              "--output", "sdist-acceptance.json",
          ], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: sdist-acceptance
          path: sdist-acceptance.json

  dependency-license-sbom:
    needs: build-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: zekam-distribution
          path: dist
      - run: python -m pip install pip-audit cyclonedx-bom
      - run: python -m pip install "$(find dist -name '*.whl' -print -quit)[api]"
      - run: python -m pip_audit
      - run: cyclonedx-py environment --output-file sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: zekam-sbom
          path: sbom.cdx.json

  evidence-bundle:
    needs: [build-artifacts, wheel-smoke, sdist-smoke, dependency-license-sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          path: evidence
      - run: python scripts/package_evidence_bundle.py --root evidence --source-revision ${{ github.sha }} --output evidence/package-evidence-bundle.json
      - uses: actions/upload-artifact@v4
        with:
          name: package-evidence-bundle
          path: evidence/

  package-gate:
    if: always()
    needs: [build-artifacts, wheel-smoke, sdist-smoke, dependency-license-sbom, evidence-bundle]
    runs-on: ubuntu-latest
    steps:
      - run: |
          test '${{ needs.build-artifacts.result }}' = success
          test '${{ needs.wheel-smoke.result }}' = success
          test '${{ needs.sdist-smoke.result }}' = success
          test '${{ needs.dependency-license-sbom.result }}' = success
          test '${{ needs.evidence-bundle.result }}' = success
