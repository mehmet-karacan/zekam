name: quality

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev,api]"
      - run: python scripts/protocol_generate.py --check
      - run: python scripts/generate_package_manifest.py --check
      - run: python scripts/paket_dogrula.py
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy src scripts
      - run: python scripts/ci_pytest.py -q
