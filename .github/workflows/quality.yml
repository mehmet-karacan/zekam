name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev,db,api]"
      - run: python scripts/protocol_generate.py --check
      - run: python scripts/generate_package_manifest.py --check
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy src scripts
      - run: python -m pytest -m "not postgres"

  postgres-acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: zekam
          POSTGRES_USER: zekam
          POSTGRES_PASSWORD: zekam-ci-only
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U zekam -d zekam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ZEKAM_TEST_DATABASE_HOST: 127.0.0.1
      ZEKAM_TEST_DATABASE_PORT: "5434"
      ZEKAM_TEST_DATABASE_NAME: zekam
      ZEKAM_TEST_DATABASE_USER: zekam
      ZEKAM_DATABASE_PASSWORD: zekam-ci-only
      PGPASSWORD: zekam-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,db,api]"
      - run: zekam db upgrade --uygula
      - run: python -m pytest -m postgres
