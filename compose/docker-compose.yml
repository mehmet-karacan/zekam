name: zekam

services:
  postgres:
    # PostgreSQL 18 + pgvector. Imaj digest'i release manifestinde sabitlenir.
    image: pgvector/pgvector:pg18
    container_name: zekam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ZEKAM_DATABASE_NAME:-zekam}
      POSTGRES_USER: ${ZEKAM_DATABASE_USER:-zekam}
      POSTGRES_PASSWORD: ${ZEKAM_DATABASE_PASSWORD:?ZEKAM_DATABASE_PASSWORD gerekli}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=1000
    ports:
      # Yalnizca yerel arayuze baglanir.
      - "127.0.0.1:${ZEKAM_DATABASE_PORT:-5433}:5432"
    volumes:
      - zekam-postgres-data:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${ZEKAM_DATABASE_USER:-zekam}" -d "${ZEKAM_DATABASE_NAME:-zekam}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  zekam-postgres-data:
    name: zekam-postgres-data
